<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Redirect to index.html for SPA routing
        var path = window.location.pathname;
        window.location.replace('/' + (path ? '?redirect=' + path : ''));
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
